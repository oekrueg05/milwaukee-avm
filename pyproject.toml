[project]
name = "avm"
version = "0.1.0"
description = "Milwaukee residential automated valuation model"
requires-python = ">=3.13"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
# Minimal set (Owen, 2026-10-20): syntax errors, undefined names, unused imports.
select = ["E9", "F63", "F7", "F82", "F401"]
